<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VAAAZGG – Tools &amp; Editors</title>
  <style>
    :root {
      --bg: #ffffff;
      --bg2: #f7f7f5;
      --bg3: #f0efe9;
      --bg-info: #e6f1fb;
      --bg-success: #eaf3de;
      --bg-warn: #faeeda;
      --bg-danger: #fcebeb;
      --bg-purple: #eeedfe;
      --text: #1a1a18;
      --text2: #5f5e5a;
      --text3: #888780;
      --text-info: #0c447c;
      --text-success: #3b6d11;
      --text-warn: #854f0b;
      --text-danger: #a32d2d;
      --text-purple: #3c3489;
      --border: rgba(0,0,0,0.12);
      --border2: rgba(0,0,0,0.22);
      --radius: 8px;
      --radius-lg: 12px;
      --blue: #185fa5;
      --blue-hover: #0c447c;
      --blue-light: #e6f1fb;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --bg2: #252523;
        --bg3: #2e2e2b;
        --bg-info: #042c53;
        --bg-success: #173404;
        --bg-warn: #412402;
        --bg-danger: #501313;
        --bg-purple: #26215c;
        --text: #f0efe9;
        --text2: #b4b2a9;
        --text3: #888780;
        --text-info: #85b7eb;
        --text-success: #97c459;
        --text-warn: #ef9f27;
        --text-danger: #f09595;
        --text-purple: #afa9ec;
        --border: rgba(255,255,255,0.12);
        --border2: rgba(255,255,255,0.22);
        --blue: #378add;
        --blue-hover: #85b7eb;
        --blue-light: #042c53;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      font-size: 14px;
      color: var(--text);
      background: var(--bg3);
      min-height: 100vh;
    }

    /* ── Topbar ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 24px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      color: var(--text);
    }
    .logo-box {
      width: 28px; height: 28px;
      background: var(--blue);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-box svg { width: 15px; height: 15px; fill: none; stroke: #e6f1fb; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nav { display: flex; align-items: center; gap: 4px; }
    .nav a {
      font-size: 13px;
      color: var(--text2);
      text-decoration: none;
      padding: 5px 10px;
      border-radius: var(--radius);
      cursor: pointer;
    }
    .nav a:hover { background: var(--bg2); color: var(--text); }
    .btn {
      font-size: 13px; font-weight: 500;
      padding: 6px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border2);
      cursor: pointer;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      transition: background .15s;
    }
    .btn:hover { background: var(--bg2); }
    .btn.primary { background: var(--blue); color: #fff; border-color: transparent; }
    .btn.primary:hover { background: var(--blue-hover); }
    .btn.active-admin { background: var(--blue); color: #fff; border-color: transparent; }

    /* ── Hero ── */
    .hero {
      background: var(--bg2);
      padding: 36px 24px 28px;
      border-bottom: 1px solid var(--border);
    }
    .hero h1 { font-size: 26px; font-weight: 700; margin-bottom: 7px; }
    .hero p { font-size: 13px; color: var(--text2); max-width: 500px; line-height: 1.65; margin-bottom: 18px; }
    .search-wrap {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 8px 13px;
      max-width: 420px;
    }
    .search-wrap svg { width: 14px; height: 14px; fill: none; stroke: var(--text3); stroke-width: 2; flex-shrink: 0; }
    .search-wrap input {
      border: none; background: transparent; outline: none;
      font-size: 13px; color: var(--text); width: 100%; font-family: var(--font);
    }
    .search-wrap input::placeholder { color: var(--text3); }

    /* ── Filters ── */
    .filters {
      display: flex; gap: 6px; flex-wrap: wrap;
      padding: 13px 24px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .tag {
      font-size: 12px; padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border2);
      color: var(--text2);
      background: var(--bg);
      cursor: pointer;
      transition: all .12s;
      font-family: var(--font);
    }
    .tag:hover { border-color: var(--blue); color: var(--blue); }
    .tag.on { background: var(--blue); color: #fff; border-color: transparent; }

    /* ── Sections & Grid ── */
    .content { padding: 0 24px 32px; }
    .section-lbl {
      font-size: 11px; color: var(--text3);
      font-weight: 600; letter-spacing: .6px;
      text-transform: uppercase;
      padding: 18px 0 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    /* ── Cards ── */
    .card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex; flex-direction: column; gap: 9px;
      transition: border-color .15s;
    }
    .card:hover { border-color: var(--border2); }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; }
    .app-icon {
      width: 42px; height: 42px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    .badge {
      font-size: 11px; padding: 3px 9px;
      border-radius: 20px; font-weight: 600;
    }
    .b-free { background: var(--bg-success); color: var(--text-success); }
    .b-new  { background: var(--bg-info);    color: var(--text-info); }
    .b-hot  { background: var(--bg-warn);    color: var(--text-warn); }
    .b-vaaaz{ background: var(--bg-purple);  color: var(--text-purple); }
    .card-name { font-size: 13px; font-weight: 600; }
    .card-desc { font-size: 12px; color: var(--text2); line-height: 1.55; flex: 1; }
    .card-foot {
      display: flex; align-items: center; justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 9px; margin-top: auto;
    }
    .card-meta { font-size: 11px; color: var(--text3); }
    .card-actions { display: flex; gap: 5px; }
    .dl-btn {
      font-size: 12px; font-weight: 600;
      color: var(--text-info); background: var(--bg-info);
      border: none; border-radius: 6px; padding: 4px 12px;
      cursor: pointer; font-family: var(--font);
      transition: opacity .12s;
    }
    .dl-btn:hover { opacity: .8; }
    .del-btn {
      font-size: 11px; color: var(--text-danger);
      background: var(--bg-danger); border: none;
      border-radius: 6px; padding: 4px 8px;
      cursor: pointer; font-family: var(--font);
    }
    .del-btn:hover { opacity: .8; }

    /* ── Admin panel ── */
    .admin-panel {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 20px 24px;
    }
    .admin-panel h2 { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
    .stats-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .stat {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 16px; flex: 1; min-width: 80px;
    }
    .stat-n { font-size: 22px; font-weight: 700; }
    .stat-l { font-size: 11px; color: var(--text2); margin-top: 2px; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .form-grid.three { grid-template-columns: 1fr 1fr 1fr; }
    .form-grid.four { grid-template-columns: 1fr 1fr 1fr 1fr; }
    .form-full { margin-bottom: 8px; }
    .form-actions { display: flex; align-items: center; gap: 10px; margin-top: 4px; }

    input[type=text], input[type=password], select, textarea {
      width: 100%;
      font-size: 13px;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 7px 10px;
      outline: none;
      transition: border-color .12s;
    }
    input[type=text]:focus, input[type=password]:focus, select:focus, textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(24,95,165,.15);
    }
    textarea { resize: vertical; min-height: 60px; }
    select { appearance: none; cursor: pointer; }

    label.check {
      display: flex; align-items: center; gap: 7px;
      font-size: 13px; color: var(--text2); cursor: pointer; white-space: nowrap;
    }
    input[type=checkbox] { width: 15px; height: 15px; cursor: pointer; accent-color: var(--blue); }

    .err { font-size: 12px; color: var(--text-danger); margin-top: 4px; }

    /* ── Login ── */
    .login-card {
      background: var(--bg2); border-bottom: 1px solid var(--border);
      padding: 20px 24px;
    }
    .login-card h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    .login-form { display: flex; flex-direction: column; gap: 8px; max-width: 280px; }

    /* ── Empty state ── */
    .empty { padding: 48px 24px; text-align: center; color: var(--text3); font-size: 13px; }

    /* ── Footer ── */
    footer {
      text-align: center; padding: 20px;
      font-size: 12px; color: var(--text3);
      border-top: 1px solid var(--border);
      background: var(--bg);
      margin-top: 24px;
    }

    /* ── Notification ── */
    #notif {
      position: fixed; bottom: 20px; right: 20px;
      background: var(--text); color: var(--bg);
      font-size: 13px; padding: 10px 18px;
      border-radius: var(--radius); opacity: 0;
      transition: opacity .2s; pointer-events: none;
      z-index: 200;
    }
    #notif.show { opacity: 1; }
  </style>
</head>
<body>

<div id="notif"></div>
<div id="app"></div>

<script>
const ADMIN_USER = 'admin';
const ADMIN_PASS = 'admin1223';
const STORE_KEY  = 'vaaazgg_tools_v1';

const DEFAULT_TOOLS = [
  { id:1, name:'WBV – Web Builder VAAAZ', desc:'Visual drag-and-drop web builder. Create full pages without writing code. Export clean HTML/CSS ready to deploy.', cat:'Editors', icon:'🌐', badge:'vaaaz', ver:'1.0', size:'14.2 MB', featured:true },
  { id:2, name:'HexEdit Pro',    desc:'Lightweight hex editor with binary diff view, real-time ASCII panel and file patching.',          cat:'Dev tools',    icon:'🧰', badge:'hot',   ver:'2.4', size:'3.1 MB',  featured:true },
  { id:3, name:'Markwright',     desc:'Distraction-free Markdown editor with live preview, themes and one-click PDF export.',           cat:'Editors',      icon:'📝', badge:'new',   ver:'1.1', size:'8.7 MB',  featured:false },
  { id:4, name:'SysMon',         desc:'Real-time system monitor. Track CPU, RAM, disk I/O and network usage in a clean dashboard.',    cat:'Utilities',    icon:'📊', badge:'free',  ver:'3.2', size:'2.4 MB',  featured:true },
  { id:5, name:'QuickClip',      desc:'Clipboard manager with full history, pinning, regex search and system tray support.',           cat:'Utilities',    icon:'📋', badge:'free',  ver:'2.0', size:'1.6 MB',  featured:false },
  { id:6, name:'DiskMapper',     desc:'Visual disk usage map. Find large files fast with treemap view and one-click cleanup.',         cat:'Utilities',    icon:'💾', badge:'new',   ver:'1.3', size:'3.8 MB',  featured:false },
  { id:7, name:'RunCmd',         desc:'Terminal task runner with a visual job queue, scheduled tasks and built-in log viewer.',        cat:'CLI utilities', icon:'⚡', badge:'free',  ver:'0.9', size:'1.8 MB',  featured:false },
  { id:8, name:'GrepUI',         desc:'Visual grep/search tool — find text across files with regex and deep folder scopes.',           cat:'CLI utilities', icon:'🔍', badge:'new',   ver:'0.7', size:'1.1 MB',  featured:false },
  { id:9, name:'PicSlice',       desc:'Batch image resizer and format converter. Supports WebP, AVIF, PNG, JPEG, and more.',          cat:'Image tools',  icon:'🖼️', badge:'free',  ver:'3.0', size:'5.2 MB',  featured:false },
];

let tools = [];
let adminLoggedIn = false;
let showLoginPanel = false;
let activeFilter = 'All';
let searchQuery = '';
let loginErr = '';
let form = emptyForm();

function emptyForm() {
  return { name:'', desc:'', cat:'Utilities', icon:'🔧', badge:'free', ver:'1.0', size:'', featured:false };
}

function loadTools() {
  try {
    const saved = localStorage.getItem(STORE_KEY);
    tools = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_TOOLS));
  } catch(e) {
    tools = JSON.parse(JSON.stringify(DEFAULT_TOOLS));
  }
}

function saveTools() {
  localStorage.setItem(STORE_KEY, JSON.stringify(tools));
}

function notify(msg) {
  const el = document.getElementById('notif');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

function categories() {
  return ['All', ...Array.from(new Set(tools.map(t => t.cat))).sort()];
}

function getFiltered() {
  return tools.filter(t => {
    const catOk = activeFilter === 'All' || t.cat === activeFilter;
    const q = searchQuery.toLowerCase();
    const qOk = !q || t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) || t.cat.toLowerCase().includes(q);
    return catOk && qOk;
  });
}

function iconBg(badge) {
  return { free:'#e1f5ee', new:'#e6f1fb', hot:'#faeeda', vaaaz:'#eeedfe' }[badge] || '#e1f5ee';
}

function badgeEl(b) {
  const labels = { free:'Free', new:'New', hot:'Hot', vaaaz:'VAAAZ' };
  return `<span class="badge b-${b}">${labels[b] || b}</span>`;
}

function cardEl(t) {
  const delBtn = adminLoggedIn
    ? `<button class="del-btn" onclick="deleteTool(${t.id})">Remove</button>`
    : '';
  return `
    <div class="card">
      <div class="card-top">
        <div class="app-icon" style="background:${iconBg(t.badge)}">${t.icon}</div>
        ${badgeEl(t.badge)}
      </div>
      <div class="card-name">${esc(t.name)}</div>
      <div class="card-desc">${esc(t.desc)}</div>
      <div class="card-foot">
        <span class="card-meta">v${esc(t.ver)} · ${esc(t.size)}</span>
        <span class="card-actions">
          ${delBtn}
          <button class="dl-btn" onclick="notify('Downloading ${esc(t.name)}…')">Download</button>
        </span>
      </div>
    </div>`;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function adminPanelEl() {
  if (showLoginPanel && !adminLoggedIn) {
    return `
      <div class="login-card">
        <h2>Admin login</h2>
        <div class="login-form">
          <input type="text" id="lu" placeholder="Username" autocomplete="username" />
          <input type="password" id="lp" placeholder="Password" autocomplete="current-password"
            onkeydown="if(event.key==='Enter')doLogin()" />
          ${loginErr ? `<div class="err">${loginErr}</div>` : ''}
          <button class="btn primary" onclick="doLogin()">Sign in</button>
        </div>
      </div>`;
  }
  if (!adminLoggedIn) return '';

  const total    = tools.length;
  const featured = tools.filter(t => t.featured).length;
  const cats     = new Set(tools.map(t => t.cat)).size;

  const catOptions = ['Editors','Utilities','Dev tools','CLI utilities','Image tools','File managers']
    .map(c => `<option value="${c}"${form.cat===c?' selected':''}>${c}</option>`).join('');
  const badgeOptions = ['free','new','hot','vaaaz']
    .map(b => `<option value="${b}"${form.badge===b?' selected':''}>${b.charAt(0).toUpperCase()+b.slice(1)}</option>`).join('');

  return `
    <div class="admin-panel">
      <h2>Admin panel</h2>
      <div class="stats-row">
        <div class="stat"><div class="stat-n">${total}</div><div class="stat-l">Total tools</div></div>
        <div class="stat"><div class="stat-n">${featured}</div><div class="stat-l">Featured</div></div>
        <div class="stat"><div class="stat-n">${cats}</div><div class="stat-l">Categories</div></div>
      </div>
      <div class="form-grid">
        <input type="text" id="f-name" placeholder="Tool name *" value="${esc(form.name)}" oninput="form.name=this.value" />
        <select id="f-cat" onchange="form.cat=this.value">${catOptions}</select>
      </div>
      <div class="form-full">
        <textarea id="f-desc" placeholder="Short description *" oninput="form.desc=this.value">${esc(form.desc)}</textarea>
      </div>
      <div class="form-grid three">
        <input type="text" id="f-icon" placeholder="Icon emoji" value="${esc(form.icon)}" oninput="form.icon=this.value" />
        <input type="text" id="f-ver"  placeholder="Version e.g. 1.0" value="${esc(form.ver)}" oninput="form.ver=this.value" />
        <input type="text" id="f-size" placeholder="Size e.g. 4.2 MB" value="${esc(form.size)}" oninput="form.size=this.value" />
      </div>
      <div class="form-actions">
        <select id="f-badge" style="width:120px" onchange="form.badge=this.value">${badgeOptions}</select>
        <label class="check">
          <input type="checkbox" id="f-feat" ${form.featured?'checked':''} onchange="form.featured=this.checked" />
          Featured
        </label>
        <button class="btn primary" onclick="addTool()">Add tool</button>
      </div>
    </div>`;
}

function render() {
  const filtered  = getFiltered();
  const featured  = filtered.filter(t => t.featured);
  const rest      = filtered.filter(t => !t.featured);

  const grouped = {};
  rest.forEach(t => { (grouped[t.cat] = grouped[t.cat] || []).push(t); });

  let sections = '';
  if (featured.length) {
    sections += `<div class="section-lbl">Featured</div><div class="grid">${featured.map(cardEl).join('')}</div>`;
  }
  for (const [cat, ts] of Object.entries(grouped)) {
    sections += `<div class="section-lbl">${cat}</div><div class="grid">${ts.map(cardEl).join('')}</div>`;
  }
  if (!filtered.length) {
    sections = `<div class="empty">No tools found. Try a different search or filter.</div>`;
  }

  const cats = categories();
  const adminBtnLabel = adminLoggedIn ? '⚙ Admin' : showLoginPanel ? '✕ Cancel' : 'Admin';
  const adminBtnClass = (adminLoggedIn || showLoginPanel) ? 'btn active-admin' : 'btn';

  document.getElementById('app').innerHTML = `
    <header class="topbar">
      <a class="logo" href="#">
        <div class="logo-box">
          <svg viewBox="0 0 15 12"><polyline points="1,11 4,4 7,8 9,5 14,8"/></svg>
        </div>
        VAAAZGG
      </a>
      <nav class="nav">
        <a onclick="setFilter('Editors')">Editors</a>
        <a onclick="setFilter('Utilities')">Utilities</a>
        <a onclick="setFilter('CLI utilities')">CLI</a>
        <a onclick="setFilter('Dev tools')">Dev tools</a>
        <button class="${adminBtnClass}" onclick="toggleAdmin()">${adminBtnLabel}</button>
      </nav>
    </header>

    ${adminPanelEl()}

    <div class="hero">
      <h1>Tools &amp; editors for developers</h1>
      <p>Free downloads — no ads, no trackers. Including WBV and other VAAAZ originals.</p>
      <div class="search-wrap">
        <svg viewBox="0 0 14 14"><circle cx="5.5" cy="5.5" r="4"/><line x1="9" y1="9" x2="13" y2="13"/></svg>
        <input type="text" placeholder="Search tools, editors, utilities…"
          value="${esc(searchQuery)}" oninput="doSearch(this.value)" />
      </div>
    </div>

    <div class="filters">
      ${cats.map(c => `<button class="tag${activeFilter===c?' on':''}" onclick="setFilter('${c}')">${c}</button>`).join('')}
    </div>

    <div class="content">${sections}</div>

    <footer>
      VAAAZGG.DDNS.NET &nbsp;·&nbsp; Free tools for developers &nbsp;·&nbsp; No tracking
    </footer>
  `;
}

window.doLogin = function() {
  const u = document.getElementById('lu')?.value || '';
  const p = document.getElementById('lp')?.value || '';
  if (u === ADMIN_USER && p === ADMIN_PASS) {
    adminLoggedIn = true; showLoginPanel = false; loginErr = '';
  } else {
    loginErr = 'Wrong username or password.';
  }
  render();
};

window.toggleAdmin = function() {
  if (adminLoggedIn) { adminLoggedIn = false; render(); return; }
  showLoginPanel = !showLoginPanel;
  loginErr = '';
  render();
};

window.setFilter = function(c) { activeFilter = c; render(); };

window.doSearch = function(v) { searchQuery = v; render(); };

window.addTool = function() {
  if (!form.name.trim() || !form.desc.trim()) {
    alert('Name and description are required.');
    return;
  }
  tools.push({
    id: Date.now(),
    name:     form.name.trim(),
    desc:     form.desc.trim(),
    cat:      form.cat,
    icon:     form.icon || '🔧',
    badge:    form.badge,
    ver:      form.ver || '1.0',
    size:     form.size || '—',
    featured: form.featured
  });
  form = emptyForm();
  saveTools();
  notify('Tool added!');
  render();
};

window.deleteTool = function(id) {
  if (!confirm('Remove this tool?')) return;
  tools = tools.filter(t => t.id !== id);
  saveTools();
  notify('Tool removed.');
  render();
};

window.notify = notify;

loadTools();
render();
</script>
</body>
</html>
